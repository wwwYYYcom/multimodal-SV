[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-sv-reproduction"
version = "0.1.0"
description = "Reproduction scaffold for multi-utterance multimodal speaker verification"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "PyYAML>=6,<7",
  "scipy>=1.13,<2",
  "torch>=2.4,<3",
  "tqdm>=4.66,<5",
  "transformers>=4.46,<5",
]

[project.optional-dependencies]
audio = ["soundfile>=0.12,<1", "desphere[fast]>=0.1.1,<0.2"]
test = ["pytest>=8,<9"]
multimodal = ["praat-parselmouth>=0.4.5,<1", "pronouncing>=0.2.0,<1"]
plot = ["matplotlib>=3.8,<4"]

[project.scripts]
mmsv = "mmsv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
