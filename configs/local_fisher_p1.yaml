  min_segment_seconds: 1.0

split:
  train_speakers: 5712
  validation_speakers: 250
  evaluation_speakers: 1753
  require_exact_counts: false
  evaluation_min_calls: 2
  max_n: 15

trials:
  n_values: [5, 10, 15]
  validation_target_per_speaker: 100
  validation_nontarget_per_speaker: 100
  evaluation_target_per_speaker: 1
  evaluation_nontarget_per_speaker: 1

model:
  wavlm_name: microsoft/wavlm-large
  hf_endpoint: https://huggingface.co
  wavlm_frozen: true
  embedding_dim: 192
  query_heads: 4
  query_temperature: 0.3

train:
  batch_size: 2
  gradient_accumulation: 32
  checkpoint_interval_steps: 10
  epochs: 30
  learning_rate: 5.0e-4
  weight_decay: 1.0e-4
  gradient_clip: 1.0
  aam_margin: 0.2
  aam_scale: 30.0
  scheduler_step: 5
  scheduler_gamma: 0.5
