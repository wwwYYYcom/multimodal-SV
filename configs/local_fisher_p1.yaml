seed: 1234
sample_rate: 16000
crop_seconds: 4.0

data:
  fisher_audio_root: "D:/deeplearning/realtimeVoiceAnon/dataset/prefor_vpc2024/Voice-Privacy-Challenge-2024-main/corpora/fisher/fisher_eng_tr_sp_LDC2004S13/fisher_eng_tr_sp_LDC2004S13"
  fisher_transcript_root: "D:/deeplearning/realtimeVoiceAnon/dataset/prefor_vpc2024/Voice-Privacy-Challenge-2024-main/corpora/fisher/fe_03_p1_tran_LDC2004T19/fe_03_p1_tran/data/trans"
  fisher_calldata: "D:/deeplearning/realtimeVoiceAnon/dataset/prefor_vpc2024/Voice-Privacy-Challenge-2024-main/corpora/fisher/fe_03_p1_tran_LDC2004T19/fe_03_p1_tran/doc/fe_03_p1_calldata.tbl"
